services:
  - type: web
    name: synex-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_API_KEY
        sync: false
      - key: DATAHUB_GMS_URL
        sync: false
